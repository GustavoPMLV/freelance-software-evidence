name: Reproduce synthetic evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-02
        with:
          persist-credentials: false
      - name: Reproduce tests and fixtures
        working-directory: technical
        run: python3 run_evidence.py
      - name: Check B2B comparison engine
        working-directory: b2b
        run: node --test tests/engine.test.cjs
      - name: Check three B2B pages and static contracts
        working-directory: b2b
        run: python3 tests/validate_site.py
