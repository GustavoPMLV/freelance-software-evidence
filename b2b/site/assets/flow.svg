<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Duas pilhas de arquivos viram uma conferência</title>
<desc id="flow-desc">A pilha A, de pedidos aprovados, e a pilha B, preparada para o ERP, passam por uma chave única de pedido e SKU e chegam a uma folha de conferência. Cada linha recebe um estado: confere, valor divergente, ausente, inesperado ou duplicado. O total fica em aberto porque há pendências.</desc>
